<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="author" content="Yan Verrept" />
        <meta name="description" content="This site is for the dashboard of the water filter project." />
        <title>Local</title>
        <!--<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">-->
        <!--<link rel="stylesheet" href="styles/bootstrap-reboot.css">-->
        <!--<link rel="stylesheet" href="styles/bootstrap-grid.css">-->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap-reboot.min.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap-grid.min.css" />
        <link rel="stylesheet" href="styles/local.css" />
    </head>
    <body>
        <header>
            <h1>Local Dashboard</h1>
        </header>

        <div class="container-fluid">
            <div class="form-container">
                <div class="add-hospital-section">
                    <h2>Add New Hospital</h2>
                    <form id="hospitalForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="hospitalName">Hospital Name *</label>
                                <input type="text" id="hospitalName" name="name" required placeholder="Enter hospital name" />
                            </div>
                            <div class="form-group">
                                <label for="hospitalPhone">Phone</label>
                                <input type="tel" id="hospitalPhone" name="phone" placeholder="(555) 123-4567" />
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="hospitalEmail">Email</label>
                                <input type="email" id="hospitalEmail" name="email" placeholder="hospital@example.com" />
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="hospitalAddress">Address</label>
                                <input type="text" id="hospitalAddress" name="address" placeholder="123 Main Street" />
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="hospitalCity">City</label>
                                <input type="text" id="hospitalCity" name="city" placeholder="New York" />
                            </div>
                            <div class="form-group">
                                <label for="hospitalState">State</label>
                                <input type="text" id="hospitalState" name="state" placeholder="NY" maxlength="2" />
                            </div>
                            <div class="form-group">
                                <label for="hospitalZip">Zip Code</label>
                                <input type="text" id="hospitalZip" name="zip_code" placeholder="10001" />
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit">+ Create Hospital</button>
                            <button type="reset" class="btn-reset">Clear</button>
                        </div>
                        <div id="formMessage" class="form-message"></div>
                    </form>
                </div>
            </div>
            <article class="row">
                <section id="column-1" class="col-12 col-md-3 offset-md-1">
                    <div class="hospital-card">
                    </div>
                </section>

                <section id="column-2" class="col-12 col-md-4">
                    <div class="hospital-card">
                    </div>
                </section>

                <section id="column-3" class="col-12 col-md-3">
                    <div class="hospital-card">
                    </div>
                </section>
            </article>
            <article class="row">
                <section id="column-4" class="col-12 col-md-3 offset-md-1">
                    <div class="hospital-card"></div>
                </section>
                <section id="column-5" class="col-12 col-md-4">
                    <div class="hospital-card"></div>
               </section>
                <section id="column-6" class="col-12 col-md-3">
                    <div class="hospital-card"></div>
                </section>
            </article>
        </div>

        <footer>
            <p>&copy; 2024 Yan Verrept. All Rights Reserved</p>
        </footer>
        
        <script src="javascript/local.js"></script>
    </body>
</html>
