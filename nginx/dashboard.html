<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="author" content="Yan Verrept" />
        <meta name="description" content="This site is for the dashboard of the water filter project." />
        <title>Dashboard</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap-reboot.min.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap-grid.min.css" />
        <link rel="stylesheet" href="styles/dashboard.css" />
    </head>
    <body>
        <header>
            <h1>Dashboard</h1>
        </header>

        <div class="container-fluid">
            <article class="row" style="margin-bottom: 20px;">
                <section class="col-12 col-md-6 offset-md-3">
                    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">
                        <h3 style="margin-top: 0;">Add Sensor Data</h3>
                        <form id="sensorForm" style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <input 
                                type="number" 
                                id="sensorValue" 
                                placeholder="Sensor Value" 
                                step="0.1"
                                required
                                style="flex: 1; min-width: 150px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"
                            />
                            <select 
                                id="statusSelect" 
                                required
                                style="min-width: 120px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"
                            >
                                <option value="">Select Status</option>
                                <option value="healthy">Healthy</option>
                                <option value="warning">Warning</option>
                                <option value="critical">Critical</option>
                            </select>
                            <button 
                                type="submit"
                                style="padding: 8px 20px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;"
                            >
                                Submit
                            </button>
                        </form>
                        <p id="formMessage" style="margin-top: 10px; font-size: 12px; display: none;"></p>
                    </div>
                </section>
            </article>
        </div>

        <div class="container-fluid">
            <article class="row">
                <section id="column-1" class="col-12 col-md-3 offset-md-1">
                    <div>

                    </div>
                </section>

                <section id="column-2" class="col-12 col-md-4">
                    <div>

                    </div>
                </section>

                <section id="column-3" class="col-12 col-md-3">
                    <div>

                    </div>
                </section>
            </article>
            <article class="row">
                <section id="column-4" class="col-12 col-md-3 offset-md-1">
                    <div></div>
                </section>
                <section id="column-5" class="col-12 col-md-4">
                    <div></div>
               </section>
                <section id="column-6" class="col-12 col-md-3">
                    <div></div>
                </section>
            </article>
        </div>

        <footer>
            <p>&copy; 2024 Yan Verrept. All Rights Reserved</p>
        </footer>
        <script src="javascript/dashboard.js"></script>
    </body>
</html>
